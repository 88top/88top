name: Delete repos folder

on:
  workflow_dispatch:  # 手动触发

jobs:
  delete-folder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: 88top/88top
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Remove repos folder
        run: |
          set -x
          echo "当前目录内容："
          ls -la

          if [ -d "repos" ]; then
            echo "找到 repos 文件夹，统计文件数量..."
            find repos -type f | wc -l

            echo "直接删除文件夹（不逐文件走 git rm，速度更快）..."
            rm -rf repos

            echo "将变更加入暂存区..."
            git add -A

            echo "repos 文件夹已删除"
          else
            echo "repos 文件夹不存在，跳过"
          fi

      - name: Commit and push changes
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "没有需要提交的变更"
          else
            git commit -m "chore: 删除 repos 文件夹"
            git push
          fi
