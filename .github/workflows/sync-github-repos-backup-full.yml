name: 同步 GitHub 仓库备份(全分支 · 增量 · 自动识别公开/私有 · SSH兜底)

# 增量备份脚本:
# - 按分支备份所有仓库(repos/仓库名/分支名/),只保留当下快照,不含提交历史
# - SYNC_MANIFEST.json 记录每个"仓库/分支"的 remote_sha(上游commit) 与
#   local_fingerprint(本地内容指纹),每次运行现场比对两者,都一致才跳过,
#   否则重新 clone 并用 rsync 精准覆盖(只写变化的文件)
# - 上游删除的仓库/分支,本地与 manifest 同步清理;枚举失败的仓库本地历史保留
# - AUTH_PAT_TIMEFLYSOON 校验通过则为"公开+私有全量"模式,否则降级为"仅公开仓库"
# - 可选 SSH_PRIVATE_KEY_TIMEFLYSOON,在 token 枚举分支失败时兜底重试

on:
  schedule:
    - cron: '0 19 * * *'   # 每天 UTC 19:00(北京时间次日 3:00)
  workflow_dispatch:

run-name: 仓库备份 (${{ github.event_name == 'workflow_dispatch' && '手动触发' || '定时任务' }})

permissions:
  contents: write

concurrency:
  group: github-backup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      SYNC_USERNAME: "timeflysoon"        # 要同步的 GitHub 账户名
      LOCAL_PROTECT_LIST: "88top"          # 本地保护名单(空格分隔),不参与远程比对与清理
      REMOTE_EXCLUDE_LIST: ""              # 远程排除名单(空格分隔),本地历史会被清理

    steps:
      - name: 拉取本仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装依赖(jq / rsync)
        run: sudo apt-get update && sudo apt-get install -y jq rsync

      - name: 校验 / 初始化 SYNC_MANIFEST.json
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="./SYNC_MANIFEST.json"
          mkdir -p ./repos

          # 文件缺失/为空/非对象结构,一律重置为空对象,后续按"无记录"处理
          VALID=1
          if [ ! -f "$MANIFEST" ]; then
            VALID=0
          elif [ ! -s "$MANIFEST" ]; then
            VALID=0
          elif ! jq -e 'type == "object"' "$MANIFEST" >/dev/null 2>&1; then
            VALID=0
          fi

          if [ "$VALID" -eq 0 ]; then
            echo '{}' > "$MANIFEST"
            echo "SYNC_MANIFEST.json 无有效记录,按空清单继续"
          else
            echo "SYNC_MANIFEST.json 校验通过,共 $(jq 'keys | length' "$MANIFEST") 个仓库记录"
          fi

      - name: 同步仓库(增量 · 逐仓库逐分支比对 · SSH兜底)
        id: sync
        shell: bash
        env:
          AUTH_PAT_TIMEFLYSOON: ${{ secrets.AUTH_PAT_TIMEFLYSOON }}
          PUBLIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_PRIVATE_KEY_TIMEFLYSOON: ${{ secrets.SSH_PRIVATE_KEY_TIMEFLYSOON }}
        run: |
          set -euo pipefail
          MANIFEST="$(pwd)/SYNC_MANIFEST.json"
          cd ./repos

          USERNAME="$SYNC_USERNAME"
          if [ -z "$USERNAME" ]; then
            echo "错误: 请填写 SYNC_USERNAME"
            exit 1
          fi

          in_list() { local n="$1" l="$2"; for i in $l; do [ "$i" = "$n" ] && return 0; done; return 1; }

          # 对目录下所有文件内容做哈希,顺序无关,用于判断内容是否变化
          calc_fingerprint() {
            local dir="$1"
            if [ ! -d "$dir" ]; then
              echo "EMPTY_DIR"; return
            fi
            local h
            h=$(find "$dir" -type f -print0 2>/dev/null | sort -z | xargs -0 sha256sum 2>/dev/null | sha256sum | awk '{print $1}')
            if [ -z "$h" ]; then echo "EMPTY_DIR"; else echo "$h"; fi
          }

          manifest_get_field() {
            local repo="$1" branch="$2" field="$3"
            jq -r --arg r "$repo" --arg b "$branch" --arg f "$field" \
              '.[$r][$b][$f] // empty' "$MANIFEST"
          }

          manifest_set_branch() {
            local repo="$1" branch="$2" sha="$3" fp="$4"
            local tmp; tmp=$(mktemp)
            jq --arg r "$repo" --arg b "$branch" --arg sha "$sha" --arg fp "$fp" \
              '.[$r] = ((.[$r] // {}) + {($b): {"remote_sha": $sha, "local_fingerprint": $fp}})' \
              "$MANIFEST" > "$tmp" && mv "$tmp" "$MANIFEST"
          }

          manifest_delete_branch() {
            local repo="$1" branch="$2"
            local tmp; tmp=$(mktemp)
            jq --arg r "$repo" --arg b "$branch" \
              'if .[$r] then .[$r] |= del(.[$b]) else . end' \
              "$MANIFEST" > "$tmp" && mv "$tmp" "$MANIFEST"
          }

          # 按目录名删除(仓库在远程已消失,拿不到完整 owner/repo)
          manifest_delete_repo_by_name() {
            local name="$1"
            local tmp; tmp=$(mktemp)
            jq --arg n "$name" \
              'with_entries(select((.key | split("/") | last) != $n))' \
              "$MANIFEST" > "$tmp" && mv "$tmp" "$MANIFEST"
          }

          HOSTING_REPO_NAME="$(echo "${GITHUB_REPOSITORY:-}" | cut -d'/' -f2)"

          # 判定运行模式:AUTH_PAT_TIMEFLYSOON 校验通过则全量,否则仅公开仓库
          MODE="public"
          AUTH_TOKEN=""

          if [ -n "${AUTH_PAT_TIMEFLYSOON:-}" ]; then
            CHECK=$(mktemp)
            HTTP_CODE=$(curl -s -o "$CHECK" -w '%{http_code}' --connect-timeout 15 --max-time 30 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${AUTH_PAT_TIMEFLYSOON}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              LOGIN=$(jq -r '.login // empty' "$CHECK" 2>/dev/null || echo "")
              if [ "$LOGIN" = "$USERNAME" ]; then
                MODE="full"; AUTH_TOKEN="$AUTH_PAT_TIMEFLYSOON"
                echo "✅ AUTH_PAT_TIMEFLYSOON 校验通过(账户: $LOGIN) → 全量模式"
              else
                echo "⚠️ AUTH_PAT_TIMEFLYSOON 账户($LOGIN)与 SYNC_USERNAME 不一致 → 降级为公开模式"
              fi
            else
              echo "⚠️ AUTH_PAT_TIMEFLYSOON 校验失败(HTTP $HTTP_CODE) → 降级为公开模式"
            fi
            rm -f "$CHECK"
          else
            echo "未配置 AUTH_PAT_TIMEFLYSOON → 公开模式"
          fi

          MODE_LABEL="仅公开仓库"
          if [ "$MODE" = "full" ]; then
            MODE_LABEL="公开+私有全量"
          fi
          echo "★ 本次运行模式: ${MODE_LABEL} ★"

          SSH_AVAILABLE=0
          if [ -n "${SSH_PRIVATE_KEY_TIMEFLYSOON:-}" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "$SSH_PRIVATE_KEY_TIMEFLYSOON" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
            SSH_AVAILABLE=1
            echo "已配置 SSH 兜底"
          fi

          # 拉取远程仓库列表
          LIST=$(mktemp)
          PAGE=1
          if [ "$MODE" = "full" ]; then
            while true; do
              R=$(curl -fsSL --connect-timeout 15 --max-time 30 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${AUTH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/user/repos?per_page=100&page=${PAGE}&visibility=all&affiliation=owner,collaborator,organization_member")
              N=$(echo "$R" | jq 'length')
              if [ "$N" -eq 0 ]; then break; fi
              echo "$R" | jq -r --arg u "$USERNAME" '.[] | select(.owner.login==$u) | .full_name' >> "$LIST"
              PAGE=$((PAGE+1))
            done
          else
            while true; do
              R=$(curl -fsSL --connect-timeout 15 --max-time 30 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${PUBLIC_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/users/${USERNAME}/repos?per_page=100&page=${PAGE}&type=public")
              N=$(echo "$R" | jq 'length')
              if [ "$N" -eq 0 ]; then break; fi
              echo "$R" | jq -r '.[] | .full_name' >> "$LIST"
              PAGE=$((PAGE+1))
            done
          fi
          sort -u "$LIST" -o "$LIST"
          TOTAL=$(wc -l < "$LIST" | tr -d ' ')
          echo "远程共发现 $TOTAL 个仓库"

          OK=0; FAIL=0; EXCLUDED=0; PROTECTED=0
          BR_OK=0; BR_FAIL=0; BR_SKIP=0; BR_DELETED=0
          FAIL_REPOS=""; SSH_REPOS=""
          IDX=0

          EXPECTED_NAMES=$(mktemp)      # 本次确认应存在于本地的仓库目录名
          ENUM_FAILED_NAMES=$(mktemp)   # 本次枚举分支失败的仓库目录名,不参与"上游已删除"判定

          while IFS= read -r FULL_NAME; do
            if [ -z "$FULL_NAME" ]; then continue; fi
            IDX=$((IDX+1))
            NAME="$(echo "$FULL_NAME" | cut -d'/' -f2)"
            echo ""
            echo "📦 ($IDX/$TOTAL) $FULL_NAME"

            if in_list "$NAME" "$REMOTE_EXCLUDE_LIST" || [ "$NAME" = "$HOSTING_REPO_NAME" ]; then
              echo "🚫 跳过(排除名单或本仓库自身)"; EXCLUDED=$((EXCLUDED+1)); continue
            fi
            if in_list "$NAME" "$LOCAL_PROTECT_LIST"; then
              echo "🔒 跳过(本地保护)"; PROTECTED=$((PROTECTED+1)); continue
            fi

            echo "$NAME" >> "$EXPECTED_NAMES"

            if [ "$MODE" = "full" ]; then
              URL="https://x-access-token:${AUTH_TOKEN}@github.com/${FULL_NAME}.git"
            else
              URL="https://github.com/${FULL_NAME}.git"
            fi

            ERR=$(mktemp)
            if RAW=$(git ls-remote --heads "$URL" 2>"$ERR"); then
              BRANCHES=$(echo "$RAW" | awk '{print $2}' | sed 's#refs/heads/##')
              rm -f "$ERR"
            elif [ "$SSH_AVAILABLE" = "1" ] && SRAW=$(git ls-remote --heads "git@github.com:${FULL_NAME}.git" 2>/dev/null); then
              echo "    ⚠️ token 失败,SSH 兜底成功,改用 SSH 克隆"
              rm -f "$ERR"
              URL="git@github.com:${FULL_NAME}.git"
              RAW="$SRAW"
              BRANCHES=$(echo "$SRAW" | awk '{print $2}' | sed 's#refs/heads/##')
              SSH_REPOS="$SSH_REPOS $NAME"
            else
              echo "    ✗ 枚举分支失败:"; sed 's/^/      /' "$ERR"; rm -f "$ERR"
              echo "$NAME" >> "$ENUM_FAILED_NAMES"
              FAIL=$((FAIL+1)); FAIL_REPOS="$FAIL_REPOS $NAME"; continue
            fi

            if [ -z "$BRANCHES" ]; then
              mkdir -p "$NAME" && [ -z "$(ls -A "$NAME")" ] && touch "$NAME/.gitkeep"
              OK=$((OK+1)); echo "✅ 完成(空仓库)"; continue
            fi

            CURRENT_BR_FILE=$(mktemp)
            RBOK=0; RBFAIL=0; RBSKIP=0
            while IFS= read -r B; do
              if [ -z "$B" ]; then continue; fi
              echo "$B" >> "$CURRENT_BR_FILE"
              DIR="$NAME/$B"

              REMOTE_SHA=$(echo "$RAW" | awk -v ref="refs/heads/$B" '$2==ref{print $1; exit}')
              MANIFEST_SHA=$(manifest_get_field "$FULL_NAME" "$B" "remote_sha")
              MANIFEST_FP=$(manifest_get_field "$FULL_NAME" "$B" "local_fingerprint")
              CURRENT_FP=$(calc_fingerprint "$DIR")

              # 远程 SHA 与本地指纹都对得上,才判定为未变化
              if [ -n "$MANIFEST_SHA" ] && [ "$MANIFEST_SHA" = "$REMOTE_SHA" ] \
                 && [ -n "$MANIFEST_FP" ] && [ "$MANIFEST_FP" = "$CURRENT_FP" ]; then
                echo "      ⏭️  $B 未变化,跳过"
                RBSKIP=$((RBSKIP+1)); continue
              fi

              TMPCLONE=$(mktemp -d)
              if git clone --quiet --depth 1 --single-branch --branch "$B" "$URL" "$TMPCLONE" 2>&1 | sed 's/^/        /'; then
                rm -rf "$TMPCLONE/.git"
                mkdir -p "$DIR"
                rsync -a --delete "$TMPCLONE/" "$DIR/"
                if [ -z "$(ls -A "$DIR")" ]; then touch "$DIR/.gitkeep"; fi
                NEW_FP=$(calc_fingerprint "$DIR")
                manifest_set_branch "$FULL_NAME" "$B" "$REMOTE_SHA" "$NEW_FP"
                echo "      ✏️  $B 已更新"
                RBOK=$((RBOK+1))
              else
                echo "      ✗ $B 克隆失败"
                RBFAIL=$((RBFAIL+1))
              fi
              rm -rf "$TMPCLONE"
            done <<< "$BRANCHES"

            # 本地存在但这次远程枚举不到的分支,视为上游已删除
            if [ -d "$NAME" ]; then
              for LOCALBR in "$NAME"/*/; do
                [ -d "$LOCALBR" ] || continue
                BRNAME="$(basename "$LOCALBR")"
                if ! grep -qxF "$BRNAME" "$CURRENT_BR_FILE"; then
                  echo "      🗑️  远程分支 $BRNAME 已删除,清理本地"
                  rm -rf "$LOCALBR"
                  manifest_delete_branch "$FULL_NAME" "$BRNAME"
                  BR_DELETED=$((BR_DELETED+1))
                fi
              done
            fi
            rm -f "$CURRENT_BR_FILE"

            BR_OK=$((BR_OK+RBOK)); BR_FAIL=$((BR_FAIL+RBFAIL)); BR_SKIP=$((BR_SKIP+RBSKIP))
            if [ "$RBOK" -gt 0 ] || [ "$RBSKIP" -gt 0 ]; then
              OK=$((OK+1)); echo "✅ 完成: 更新 $RBOK / 跳过 $RBSKIP / 失败 $RBFAIL 分支"
            else
              FAIL=$((FAIL+1)); echo "❌ 完成: 0 个分支成功"
            fi
          done < "$LIST"
          rm -f "$LIST"

          # 清理上游已彻底消失的仓库(排除名单/枚举失败的不动)
          REPO_PURGED=0
          for LOCALDIR in */; do
            [ -d "$LOCALDIR" ] || continue
            LNAME="$(basename "$LOCALDIR")"
            if [ "$LNAME" = "$HOSTING_REPO_NAME" ]; then continue; fi
            if in_list "$LNAME" "$LOCAL_PROTECT_LIST"; then continue; fi
            if grep -qxF "$LNAME" "$ENUM_FAILED_NAMES"; then continue; fi
            if ! grep -qxF "$LNAME" "$EXPECTED_NAMES"; then
              echo "🗑️ 上游仓库已删除或不再可见: $LNAME,清理本地备份"
              rm -rf "$LNAME"
              manifest_delete_repo_by_name "$LNAME"
              REPO_PURGED=$((REPO_PURGED+1))
            fi
          done
          rm -f "$EXPECTED_NAMES" "$ENUM_FAILED_NAMES"

          echo ""
          echo "=========================================="
          echo "🎉 同步完成(模式: ${MODE_LABEL})"
          echo "  ✅ 仓库成功: $OK   ❌ 仓库失败: $FAIL   🗑️ 仓库清理: $REPO_PURGED"
          echo "  🚫 已排除:   $EXCLUDED   🔒 已保护: $PROTECTED"
          echo "  🌿 分支更新: $BR_OK   ⏭️ 分支跳过: $BR_SKIP   ⚠️ 分支失败: $BR_FAIL   🗑️ 分支清理: $BR_DELETED"
          if [ -n "$SSH_REPOS" ]; then echo "  🔑 SSH兜底成功: $SSH_REPOS"; fi
          if [ -n "$FAIL_REPOS" ]; then echo "  ⚠️ 枚举失败(本地历史已保留): $FAIL_REPOS"; fi
          echo "=========================================="

          {
            echo "BACKUP_MODE_LABEL=$MODE_LABEL"
            echo "BACKUP_REMOTE_COUNT=$TOTAL"
            echo "BACKUP_REPO_OK=$OK"
            echo "BACKUP_REPO_FAIL=$FAIL"
            echo "BACKUP_REPO_PURGED=$REPO_PURGED"
            echo "BACKUP_EXCLUDE=$EXCLUDED"
            echo "BACKUP_PROTECT=$PROTECTED"
            echo "BACKUP_BRANCH_OK=$BR_OK"
            echo "BACKUP_BRANCH_SKIP=$BR_SKIP"
            echo "BACKUP_BRANCH_FAIL=$BR_FAIL"
            echo "BACKUP_BRANCH_DELETED=$BR_DELETED"
            echo "BACKUP_AUTH_FAIL_REPOS=$FAIL_REPOS"
            echo "BACKUP_SSH_FALLBACK_REPOS=$SSH_REPOS"
          } >> "$GITHUB_ENV"

      - name: 检测超大文件(>95MiB 直接失败)
        shell: bash
        run: |
          set -euo pipefail
          BIG=$(find ./repos -type f -size +95M -printf '%s\t%p\n' | sort -rn | head -30)
          if [ -n "$BIG" ]; then
            echo "错误: 发现超过 95MiB 的文件,push 会被 GitHub 拒绝:"
            echo "$BIG"
            exit 1
          fi
          echo "通过"

      - name: 生成 BACKUP_STATUS.txt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          UTC="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          CN="$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S 北京时间')"
          FAIL="${BACKUP_REPO_FAIL:-N/A}"
          if [ "$FAIL" = "0" ]; then STATUS="✅ 备份任务执行完成"
          elif [ "$FAIL" = "N/A" ]; then STATUS="❌ 同步步骤未完成,请查看运行日志"
          else STATUS="⚠️ 完成,但有 ${FAIL} 个仓库未成功"; fi

          cat > ./BACKUP_STATUS.txt << EOF
          ========================================
          📊 最近一次备份报告
          ========================================
          备份时间(UTC): ${UTC}
          备份时间(北京): ${CN}
          备份模式: ${BACKUP_MODE_LABEL:-N/A}
          远程仓库总数: ${BACKUP_REMOTE_COUNT:-N/A}
          状态: ${STATUS}
          ----------------------------------------
          ✅ 仓库成功: ${BACKUP_REPO_OK:-N/A}
          ❌ 仓库失败: ${BACKUP_REPO_FAIL:-N/A}
          🗑️ 仓库清理(上游已删除): ${BACKUP_REPO_PURGED:-N/A}
          🔒 已保护:   ${BACKUP_PROTECT:-N/A}
          🚫 已排除:   ${BACKUP_EXCLUDE:-N/A}
          ----------------------------------------
          🌿 分支更新: ${BACKUP_BRANCH_OK:-N/A}
          ⏭️ 分支跳过(未变化): ${BACKUP_BRANCH_SKIP:-N/A}
          ⚠️ 分支失败: ${BACKUP_BRANCH_FAIL:-N/A}
          🗑️ 分支清理(上游已删除): ${BACKUP_BRANCH_DELETED:-N/A}
          EOF

          if [ -n "${BACKUP_SSH_FALLBACK_REPOS:-}" ]; then
            { echo ""; echo "🔑 SSH兜底成功: ${BACKUP_SSH_FALLBACK_REPOS}"; } >> ./BACKUP_STATUS.txt
          fi
          if [ -n "${BACKUP_AUTH_FAIL_REPOS:-}" ]; then
            { echo ""; echo "⚠️ 枚举失败(本地历史已保留): ${BACKUP_AUTH_FAIL_REPOS}"; } >> ./BACKUP_STATUS.txt
          fi
          echo "========================================" >> ./BACKUP_STATUS.txt
          cat ./BACKUP_STATUS.txt

      - name: 生成 Job Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CN="$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          TRIGGER="定时任务"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRIGGER="手动触发"
          fi
          {
            echo "## 📊 仓库备份报告"
            echo "**时间**: ${CN}(北京) ｜ **触发**: ${TRIGGER} ｜ **模式**: \`${BACKUP_MODE_LABEL:-N/A}\`"
            echo ""
            echo "| 状态 | 数量 |"
            echo "|---|---|"
            echo "| ✅ 仓库成功 | ${BACKUP_REPO_OK:-N/A} |"
            echo "| ❌ 仓库失败 | ${BACKUP_REPO_FAIL:-N/A} |"
            echo "| 🗑️ 仓库清理 | ${BACKUP_REPO_PURGED:-N/A} |"
            echo "| 🔒 已保护 | ${BACKUP_PROTECT:-N/A} |"
            echo "| 🚫 已排除 | ${BACKUP_EXCLUDE:-N/A} |"
            echo "| 🌿 分支更新 | ${BACKUP_BRANCH_OK:-N/A} |"
            echo "| ⏭️ 分支跳过(未变化) | ${BACKUP_BRANCH_SKIP:-N/A} |"
            echo "| ⚠️ 分支失败 | ${BACKUP_BRANCH_FAIL:-N/A} |"
            echo "| 🗑️ 分支清理 | ${BACKUP_BRANCH_DELETED:-N/A} |"
            echo "| 📦 远程总数 | ${BACKUP_REMOTE_COUNT:-N/A} |"
            if [ -n "${BACKUP_SSH_FALLBACK_REPOS:-}" ]; then
              echo ""
              echo "**🔑 SSH兜底成功**: ${BACKUP_SSH_FALLBACK_REPOS}"
            fi
            if [ -n "${BACKUP_AUTH_FAIL_REPOS:-}" ]; then
              echo ""
              echo "**⚠️ 枚举失败(本地历史已保留)**: ${BACKUP_AUTH_FAIL_REPOS}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提交备份结果
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ./repos ./BACKUP_STATUS.txt ./SYNC_MANIFEST.json
          if git diff --staged --quiet; then
            echo "没有变化,无需提交"; exit 0
          fi
          git commit -m "自动同步备份(增量·${BACKUP_MODE_LABEL:-未知模式}) $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push

# AUTH_PAT_TIMEFLYSOON(必需,用于私库备份):
#   GitHub → Settings → Developer settings → Personal access tokens
#   → Tokens (classic) → 勾选 repo + workflow → 复制
#   → 备份仓库 Settings → Secrets and variables → Actions
#   → New repository secret → Name: AUTH_PAT_TIMEFLYSOON
#
# SSH_PRIVATE_KEY_TIMEFLYSOON(可选,枚举分支失败时兜底):
#   用账户已部署的 SSH key 私钥内容(含 BEGIN/END 两行)
#   → 同样加进备份仓库 Secrets → Name: SSH_PRIVATE_KEY_TIMEFLYSOON
#
# SYNC_MANIFEST.json(自动维护,无需手动配置):
#   记录每个"仓库/分支"的 remote_sha 与 local_fingerprint。
