name: 同步 GitHub 仓库备份(全分支 · 自动识别公开/私有 · SSH兜底)

# ============================================================
# 功能说明
# ============================================================
# 1. 按分支备份,不只是默认分支:先枚举每个仓库的所有分支,逐个浅克隆。
#    目录结构: repos/仓库名/分支名/(该分支下文件)
#    注意:只保留"当下快照",不含任何提交历史。
#
# 2. AUTH_PAT_TIMEFLYSOON 自动降级,一份 yml 通吃两种场景:
#    - 未配置 / 校验失败(过期、账户不符等) → 自动降级为【仅公开仓库】模式,
#      改用 Actions 自带的 GITHUB_TOKEN,不报错、不中断。
#    - 校验通过 → 升级为【公开+私有全量】模式。
#    AUTH_PAT_TIMEFLYSOON 的作用:①判定模式 ②调用 GitHub API 拉取仓库列表
#    ③给公开+私有全量模式下的 clone 做认证。这一步是 SSH 协议做不到的
#    (SSH 无法列出"账户下有哪些仓库",只能在已知仓库名的前提下 clone)。
#
# 3. SSH 兜底(可选):个别仓库偶发因权限原因导致 token 方式
#    git ls-remote 失败时,若配置了 SSH_PRIVATE_KEY_TIMEFLYSOON,自动改用
#    SSH 重试一次,成功则该仓库单独走 SSH 完成克隆,不影响其他仓库继续走 token。
#    未配置 SSH_PRIVATE_KEY_TIMEFLYSOON 完全不受影响,行为等同没有这个功能。
#
# 4. 统计口径说明(避免误解):
#    "仓库成功" = token 方式成功的仓库数 + SSH 兜底成功的仓库数 之和,
#    两者不重复、不冲突,SSH 兜底成功的仓库会单独在日志/报告里列出来。
#
# 5. 运行报告:
#    - Job Summary(Actions 运行页面顶部表格)
#    - BACKUP_STATUS.txt(提交进仓库,长期留存,不受 Actions 日志 90 天限制)
# ============================================================

on:
  schedule:
    - cron: '0 19 * * *'   # 每天 UTC 19:00(北京时间次日 3:00)
  workflow_dispatch:        # 允许手动触发

run-name: 仓库备份 (${{ github.event_name == 'workflow_dispatch' && '手动触发' || '定时任务' }})

permissions:
  contents: write   # git push 需要写权限

concurrency:
  group: github-backup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 分支数量多时耗时会明显增加,按需调整

    # ============================================================
    # ★★★ 需要手动配置的部分 ★★★
    # ============================================================
    env:
      SYNC_USERNAME: "timeflysoon"        # 要同步的 GitHub 账户名
      LOCAL_PROTECT_LIST: "88top"          # 本地保护名单(空格分隔,不会被覆盖)
      REMOTE_EXCLUDE_LIST: ""              # 远程排除名单(空格分隔,仓库级别)
    # ============================================================

    steps:
      - name: 拉取本仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 清空旧备份内容(先保护白名单目录)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./repos
          STASH=$(mktemp -d)
          for name in $LOCAL_PROTECT_LIST; do
            if [ -d "./repos/$name" ]; then mv "./repos/$name" "$STASH/$name"; fi
          done
          rm -rf ./repos
          mkdir -p ./repos
          for name in $LOCAL_PROTECT_LIST; do
            if [ -d "$STASH/$name" ]; then mv "$STASH/$name" "./repos/$name"; fi
          done
          rm -rf "$STASH"

      - name: 同步仓库(自动识别模式 · 逐仓库逐分支 clone · SSH兜底)
        id: sync
        shell: bash
        env:
          AUTH_PAT_TIMEFLYSOON: ${{ secrets.AUTH_PAT_TIMEFLYSOON }}
          PUBLIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_PRIVATE_KEY_TIMEFLYSOON: ${{ secrets.SSH_PRIVATE_KEY_TIMEFLYSOON }}
        run: |
          set -euo pipefail
          cd ./repos

          USERNAME="$SYNC_USERNAME"
          if [ -z "$USERNAME" ]; then
            echo "错误: 请填写 SYNC_USERNAME"
            exit 1
          fi

          # ---------- 第一步: 判定运行模式 ----------
          MODE="public"
          AUTH_TOKEN=""

          if [ -n "${AUTH_PAT_TIMEFLYSOON:-}" ]; then
            CHECK=$(mktemp)
            HTTP_CODE=$(curl -s -o "$CHECK" -w '%{http_code}' --connect-timeout 15 --max-time 30 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${AUTH_PAT_TIMEFLYSOON}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              LOGIN=$(jq -r '.login // empty' "$CHECK" 2>/dev/null || echo "")
              if [ "$LOGIN" = "$USERNAME" ]; then
                MODE="full"; AUTH_TOKEN="$AUTH_PAT_TIMEFLYSOON"
                echo "✅ AUTH_PAT_TIMEFLYSOON 校验通过(账户: $LOGIN) → 全量模式"
              else
                echo "⚠️ AUTH_PAT_TIMEFLYSOON 账户($LOGIN)与 SYNC_USERNAME 不一致 → 降级为公开模式"
              fi
            else
              echo "⚠️ AUTH_PAT_TIMEFLYSOON 校验失败(HTTP $HTTP_CODE) → 降级为公开模式"
            fi
            rm -f "$CHECK"
          else
            echo "未配置 AUTH_PAT_TIMEFLYSOON → 公开模式"
          fi

          MODE_LABEL="仅公开仓库"
          if [ "$MODE" = "full" ]; then
            MODE_LABEL="公开+私有全量"
          fi
          echo "★ 本次运行模式: ${MODE_LABEL} ★"

          # ---------- SSH 兜底初始化(可选) ----------
          SSH_AVAILABLE=0
          if [ -n "${SSH_PRIVATE_KEY_TIMEFLYSOON:-}" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "$SSH_PRIVATE_KEY_TIMEFLYSOON" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
            SSH_AVAILABLE=1
            echo "已配置 SSH 兜底(SSH_PRIVATE_KEY_TIMEFLYSOON)"
          fi

          in_list() { local n="$1" l="$2"; for i in $l; do [ "$i" = "$n" ] && return 0; done; return 1; }
          HOSTING_REPO_NAME="$(echo "${GITHUB_REPOSITORY:-}" | cut -d'/' -f2)"

          # ---------- 第二步: 拉取远程仓库列表 ----------
          LIST=$(mktemp)
          PAGE=1
          if [ "$MODE" = "full" ]; then
            while true; do
              R=$(curl -fsSL --connect-timeout 15 --max-time 30 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${AUTH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/user/repos?per_page=100&page=${PAGE}&visibility=all&affiliation=owner,collaborator,organization_member")
              N=$(echo "$R" | jq 'length')
              if [ "$N" -eq 0 ]; then break; fi
              echo "$R" | jq -r --arg u "$USERNAME" '.[] | select(.owner.login==$u) | .full_name' >> "$LIST"
              PAGE=$((PAGE+1))
            done
          else
            while true; do
              R=$(curl -fsSL --connect-timeout 15 --max-time 30 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${PUBLIC_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/users/${USERNAME}/repos?per_page=100&page=${PAGE}&type=public")
              N=$(echo "$R" | jq 'length')
              if [ "$N" -eq 0 ]; then break; fi
              echo "$R" | jq -r '.[] | .full_name' >> "$LIST"
              PAGE=$((PAGE+1))
            done
          fi
          sort -u "$LIST" -o "$LIST"
          TOTAL=$(wc -l < "$LIST" | tr -d ' ')
          echo "远程共发现 $TOTAL 个仓库"
          if [ "$TOTAL" -eq 0 ]; then
            echo "⚠️ 未发现任何可备份的仓库(账户下没有公开仓库,或私有权限不可用)"
            echo "不中断运行,后续步骤将正常完成(备份结果为空)"
          fi

          # ---------- 第三步: 逐仓库同步 ----------
          OK=0; FAIL=0; EXCLUDED=0; PROTECTED=0
          BR_OK=0; BR_FAIL=0
          FAIL_REPOS=""; SSH_REPOS=""
          IDX=0

          while IFS= read -r FULL_NAME; do
            if [ -z "$FULL_NAME" ]; then continue; fi
            IDX=$((IDX+1))
            NAME="$(echo "$FULL_NAME" | cut -d'/' -f2)"
            echo ""
            echo "📦 ($IDX/$TOTAL) $FULL_NAME"

            if in_list "$NAME" "$REMOTE_EXCLUDE_LIST" || [ "$NAME" = "$HOSTING_REPO_NAME" ]; then
              echo "🚫 跳过(排除名单或本仓库自身)"; EXCLUDED=$((EXCLUDED+1)); continue
            fi
            if in_list "$NAME" "$LOCAL_PROTECT_LIST"; then
              echo "🔒 跳过(本地保护)"; PROTECTED=$((PROTECTED+1)); continue
            fi
            if [ -e "$NAME" ]; then
              echo "⚠️ 跳过(同名目录已存在)"; FAIL=$((FAIL+1)); continue
            fi

            if [ "$MODE" = "full" ]; then
              URL="https://x-access-token:${AUTH_TOKEN}@github.com/${FULL_NAME}.git"
            else
              URL="https://github.com/${FULL_NAME}.git"
            fi

            # 枚举分支;token 失败时若有 SSH 则自动重试一次
            ERR=$(mktemp)
            if RAW=$(git ls-remote --heads "$URL" 2>"$ERR"); then
              BRANCHES=$(echo "$RAW" | awk '{print $2}' | sed 's#refs/heads/##')
              rm -f "$ERR"
            elif [ "$SSH_AVAILABLE" = "1" ] && SRAW=$(git ls-remote --heads "git@github.com:${FULL_NAME}.git" 2>/dev/null); then
              echo "    ⚠️ token 失败,SSH 兜底成功,改用 SSH 克隆"
              sed 's/^/      /' "$ERR"; rm -f "$ERR"
              URL="git@github.com:${FULL_NAME}.git"
              BRANCHES=$(echo "$SRAW" | awk '{print $2}' | sed 's#refs/heads/##')
              SSH_REPOS="$SSH_REPOS $NAME"
            else
              echo "    ✗ 枚举分支失败:"; sed 's/^/      /' "$ERR"; rm -f "$ERR"
              echo "    → 常见原因: AUTH_PAT_TIMEFLYSOON(classic)已过期/撤销、该仓库需要单独 SAML SSO 授权、"
              echo "       或该仓库对该 token 存在其他访问限制"
              if [ "$SSH_AVAILABLE" = "1" ]; then
                echo "       (SSH 兜底同样失败,请检查该仓库/账户的 SSH 授权)"
              fi
              FAIL=$((FAIL+1)); FAIL_REPOS="$FAIL_REPOS $NAME"; continue
            fi

            if [ -z "$BRANCHES" ]; then
              mkdir -p "$NAME" && touch "$NAME/.gitkeep"
              OK=$((OK+1)); echo "✅ 完成(空仓库)"; continue
            fi

            BTOTAL=$(echo "$BRANCHES" | wc -l | tr -d ' ')
            RBOK=0; RBFAIL=0
            while IFS= read -r B; do
              if [ -z "$B" ]; then continue; fi
              DIR="$NAME/$B"
              if [ -e "$DIR" ]; then
                echo "      ⚠️ $B 目录冲突,跳过"; RBFAIL=$((RBFAIL+1)); continue
              fi
              if git clone --quiet --depth 1 --single-branch --branch "$B" "$URL" "$DIR" 2>&1 | sed 's/^/        /'; then
                rm -rf "$DIR/.git"
                if [ -z "$(ls -A "$DIR")" ]; then
                  touch "$DIR/.gitkeep"
                fi
                RBOK=$((RBOK+1))
              else
                rm -rf "$DIR" || true
                RBFAIL=$((RBFAIL+1))
              fi
            done <<< "$BRANCHES"

            BR_OK=$((BR_OK+RBOK)); BR_FAIL=$((BR_FAIL+RBFAIL))
            if [ "$RBOK" -gt 0 ]; then
              OK=$((OK+1)); echo "✅ 完成: 成功 $RBOK / 失败 $RBFAIL 分支"
            else
              FAIL=$((FAIL+1)); echo "❌ 完成: 0 个分支成功"
            fi
          done < "$LIST"
          rm -f "$LIST"

          echo ""
          echo "=========================================="
          echo "🎉 同步完成(模式: ${MODE_LABEL})"
          echo "  ✅ 仓库成功: $OK   ❌ 仓库失败: $FAIL"
          echo "  🚫 已排除:   $EXCLUDED   🔒 已保护: $PROTECTED"
          echo "  🌿 分支成功: $BR_OK   ⚠️ 分支失败: $BR_FAIL"
          if [ -n "$SSH_REPOS" ]; then echo "  🔑 SSH兜底成功: $SSH_REPOS"; fi
          if [ -n "$FAIL_REPOS" ]; then echo "  ⚠️ 枚举失败: $FAIL_REPOS"; fi
          echo "=========================================="

          {
            echo "BACKUP_MODE_LABEL=$MODE_LABEL"
            echo "BACKUP_REMOTE_COUNT=$TOTAL"
            echo "BACKUP_REPO_OK=$OK"
            echo "BACKUP_REPO_FAIL=$FAIL"
            echo "BACKUP_EXCLUDE=$EXCLUDED"
            echo "BACKUP_PROTECT=$PROTECTED"
            echo "BACKUP_BRANCH_OK=$BR_OK"
            echo "BACKUP_BRANCH_FAIL=$BR_FAIL"
            echo "BACKUP_AUTH_FAIL_REPOS=$FAIL_REPOS"
            echo "BACKUP_SSH_FALLBACK_REPOS=$SSH_REPOS"
          } >> "$GITHUB_ENV"

      - name: 检测超大文件(>95MiB 直接失败)
        shell: bash
        run: |
          set -euo pipefail
          BIG=$(find ./repos -type f -size +95M -printf '%s\t%p\n' | sort -rn | head -30)
          if [ -n "$BIG" ]; then
            echo "错误: 发现超过 95MiB 的文件,push 会被 GitHub 拒绝:"
            echo "$BIG"
            echo "处理建议: REMOTE_EXCLUDE_LIST 排除该仓库,或改用 Git LFS"
            exit 1
          fi
          echo "通过"

      - name: 生成 BACKUP_STATUS.txt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          UTC="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          CN="$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S 北京时间')"
          FAIL="${BACKUP_REPO_FAIL:-N/A}"
          if [ "$FAIL" = "0" ]; then STATUS="✅ 备份任务执行完成"
          elif [ "$FAIL" = "N/A" ]; then STATUS="❌ 同步步骤未完成,请查看运行日志"
          else STATUS="⚠️ 完成,但有 ${FAIL} 个仓库未成功"; fi

          cat > ./BACKUP_STATUS.txt << EOF
          ========================================
          📊 最近一次备份报告
          ========================================
          备份时间(UTC): ${UTC}
          备份时间(北京): ${CN}
          备份模式: ${BACKUP_MODE_LABEL:-N/A}
          远程仓库总数: ${BACKUP_REMOTE_COUNT:-N/A}
          状态: ${STATUS}
          ----------------------------------------
          ✅ 仓库成功: ${BACKUP_REPO_OK:-N/A}
          ❌ 仓库失败: ${BACKUP_REPO_FAIL:-N/A}
          🔒 已保护:   ${BACKUP_PROTECT:-N/A}
          🚫 已排除:   ${BACKUP_EXCLUDE:-N/A}
          🌿 分支成功: ${BACKUP_BRANCH_OK:-N/A}
          ⚠️ 分支失败: ${BACKUP_BRANCH_FAIL:-N/A}
          EOF

          if [ -n "${BACKUP_SSH_FALLBACK_REPOS:-}" ]; then
            { echo ""; echo "🔑 SSH兜底成功: ${BACKUP_SSH_FALLBACK_REPOS}"; } >> ./BACKUP_STATUS.txt
          fi
          if [ -n "${BACKUP_AUTH_FAIL_REPOS:-}" ]; then
            { echo ""; echo "⚠️ 枚举失败: ${BACKUP_AUTH_FAIL_REPOS}"; } >> ./BACKUP_STATUS.txt
          fi
          echo "========================================" >> ./BACKUP_STATUS.txt
          cat ./BACKUP_STATUS.txt

      - name: 生成 Job Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CN="$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          TRIGGER="定时任务"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRIGGER="手动触发"
          fi
          {
            echo "## 📊 仓库备份报告"
            echo "**时间**: ${CN}(北京) ｜ **触发**: ${TRIGGER} ｜ **模式**: \`${BACKUP_MODE_LABEL:-N/A}\`"
            echo ""
            echo "| 状态 | 数量 |"
            echo "|---|---|"
            echo "| ✅ 仓库成功 | ${BACKUP_REPO_OK:-N/A} |"
            echo "| ❌ 仓库失败 | ${BACKUP_REPO_FAIL:-N/A} |"
            echo "| 🔒 已保护 | ${BACKUP_PROTECT:-N/A} |"
            echo "| 🚫 已排除 | ${BACKUP_EXCLUDE:-N/A} |"
            echo "| 🌿 分支成功 | ${BACKUP_BRANCH_OK:-N/A} |"
            echo "| ⚠️ 分支失败 | ${BACKUP_BRANCH_FAIL:-N/A} |"
            echo "| 📦 远程总数 | ${BACKUP_REMOTE_COUNT:-N/A} |"
            if [ -n "${BACKUP_SSH_FALLBACK_REPOS:-}" ]; then
              echo ""
              echo "**🔑 SSH兜底成功**: ${BACKUP_SSH_FALLBACK_REPOS}"
            fi
            if [ -n "${BACKUP_AUTH_FAIL_REPOS:-}" ]; then
              echo ""
              echo "**⚠️ 枚举失败**: ${BACKUP_AUTH_FAIL_REPOS}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提交备份结果
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ./repos ./BACKUP_STATUS.txt
          if git diff --staged --quiet; then
            echo "没有变化,无需提交"; exit 0
          fi
          git commit -m "自动同步备份(全分支·${BACKUP_MODE_LABEL:-未知模式}) $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push

# ============================================================
# 配置说明
# ============================================================
# AUTH_PAT_TIMEFLYSOON(必需,用于私库备份):
#   GitHub → Settings → Developer settings → Personal access tokens
#   → Tokens (classic) → Generate new token (classic)
#   勾选 repo + workflow → 复制 → 备份仓库 Settings → Secrets and variables
#   → Actions → New repository secret → Name: AUTH_PAT_TIMEFLYSOON
#
# SSH_PRIVATE_KEY_TIMEFLYSOON(可选,个别仓库 token 失效时兜底):
#   用你账户已部署的 SSH key 公钥内容即可(无需新建),
#   复制私钥完整内容(含 BEGIN/END 两行)→ 同样加进备份仓库 Secrets
#   → Name: SSH_PRIVATE_KEY_TIMEFLYSOON
# ============================================================
